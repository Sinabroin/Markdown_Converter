name: Real PaddleOCR scanned PDF smoke

on:
  pull_request:
    paths:
      - 'f2md/extractor.py'
      - 'scripts/smoke_test_real_ocr.py'
      - '.github/workflows/real-ocr.yml'

permissions:
  contents: read

jobs:
  real-ocr:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      PADDLE_PDX_MODEL_SOURCE: BOS
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 fonts-dejavu-core
      - name: Install PaddleOCR CPU and synthetic document tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "paddlepaddle==3.2.0" "paddleocr==3.2.0" "Pillow>=10,<12" "PyMuPDF>=1.24,<2"
      - name: OCR a generated two-page, image-only PDF
        run: |
          PYTHONPATH=. python scripts/smoke_test_real_ocr.py
